name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create local.properties
        env:
          HEYMIKA_API_BASE_URL: ${{ secrets.HEYMIKA_API_BASE_URL }}
        run: |
          : > local.properties
          if [ -n "$HEYMIKA_API_BASE_URL" ]; then
            echo "heymika.api.base.url=$HEYMIKA_API_BASE_URL" >> local.properties
          fi

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/'
          if-no-files-found: ignore

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create local.properties
        env:
          HEYMIKA_API_BASE_URL: ${{ secrets.HEYMIKA_API_BASE_URL }}
        run: |
          : > local.properties
          if [ -n "$HEYMIKA_API_BASE_URL" ]; then
            echo "heymika.api.base.url=$HEYMIKA_API_BASE_URL" >> local.properties
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate JaCoCo coverage report
        run: ./gradlew :core:jacocoDebugTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: core/build/reports/jacoco/jacocoDebugTestReport/
          if-no-files-found: warn

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  build:
    name: Build release APK + AAB
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create local.properties
        env:
          HEYMIKA_API_BASE_URL: ${{ secrets.HEYMIKA_API_BASE_URL }}
        run: |
          : > local.properties
          if [ -n "$HEYMIKA_API_BASE_URL" ]; then
            echo "heymika.api.base.url=$HEYMIKA_API_BASE_URL" >> local.properties
          fi

      - name: Build release APK and app bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Check the release APK has no debug gallery
        run: scripts/ci/check-release-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: '*/build/outputs/apk/release/*.apk'
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
